services:
  postgres:
    image: postgres:16-alpine
    container_name: order-history-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    # Named volume, not a bind mount: a reviewer running this once should not
    # get a stray data directory in their checkout.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
